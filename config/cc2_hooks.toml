[[midasm_hook]]
address = 0x82543A88
name = "Cc2Scene_CountDraw"
registers = []

[[midasm_hook]]
address = 0x82544010
name = "Cc2Scene_CountDraw"
registers = []

# ============================================================================
# GPU edge layer (src/gpu/edge.cpp): the D3D runtime's GPU-facing side with no GPU behind it.
# ============================================================================

# CDevice::SetFence, at the store of the advanced fence counter: complete the fence and its ring
# position.
[[midasm_hook]]
address = 0x825486A4
name = "Cc2Edge_FenceIssued"
registers = ["r5", "r6", "r11"]

# CDevice::AddCallsToPrimaryBuffer, at the store of the new primary write index: the ring reads
# as consumed.
[[midasm_hook]]
address = 0x82548300
name = "Cc2Edge_PrimaryKick"
registers = ["r11", "r27"]

# CDevice::QueueCommands and QueueIndirectBuffer, after each add to the outstanding-buffer count:
# the GPU would retire them, so the count returns to zero at once.
[[midasm_hook]]
address = 0x82548FAC
name = "Cc2Edge_ChunkQueued"
registers = ["r31"]

[[midasm_hook]]
address = 0x82548BA0
name = "Cc2Edge_ChunkQueued"
registers = ["r31"]

[[midasm_hook]]
address = 0x82548C4C
name = "Cc2Edge_ChunkQueued"
registers = ["r31"]

[[midasm_hook]]
address = 0x82548C78
name = "Cc2Edge_ChunkQueued"
registers = ["r31"]

# D3DDevice_Swap pacing and the scene tick live in the Swap override in src/gpu/gpu_capture.cpp.
